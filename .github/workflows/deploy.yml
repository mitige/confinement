# Deploy CONFINEMENT to GitHub Pages.
#
# This is what makes the published site update itself: every push to main runs the
# geometry and timeline verification first, then builds and publishes. A change
# that breaks the machine's radial build fails the deploy rather than shipping.
#
# The build is a plain static bundle, which is all this project needs — the tokamak,
# its materials and its environment are generated in the browser at runtime, so
# there is no server-side component to host.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19 || >=22.12.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the machine (geometry, radial build, camera chain, layer budget)
        run: npm run verify

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run if it does not exist yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4